name: Patch NimasBot to Omega main

on:
  push:
    branches:
      - patch-nimas-omega-main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Omega clone source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/lichess-bot.yml')
          s = p.read_text()
          old = 'git clone https://x-access-token:${{ secrets.OMEGA_PAT }}@github.com/FayE75/Omega.git Omega'
          new = '''git clone --branch main --single-branch https://x-access-token:${{ secrets.OMEGA_PAT }}@github.com/FayE75/Omega.git Omega
        echo "Using Omega commit: $(git -C Omega rev-parse HEAD)"'''
          if old not in s:
              raise SystemExit('Omega clone line not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -F -- '--branch main --single-branch' .github/workflows/lichess-bot.yml
          grep -F -- 'Using Omega commit:' .github/workflows/lichess-bot.yml

      - name: Commit patch to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/lichess-bot.yml
          git diff --cached --check
          git commit -m "Use latest Omega main explicitly"
          git push origin HEAD:main

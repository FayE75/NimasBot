name: Apply MM config fix v2

on:
  push:
    branches:
      - matchmaking-config-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: matchmaking-config-fix
          fetch-depth: 0

      - name: Patch config
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('config.yml')
          text = path.read_text()
          start = text.index('matchmaking:\n')
          end = text.index('\nmessages:\n', start)
          encoded = ''
          block = base64.b64decode(encoded).decode()
          path.write_text(text[:start] + block + text[end:])
          PY

      - name: Validate
        run: |
          python3 -m pip install -q pyyaml
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path('config.yml').read_text())
          mm = cfg['matchmaking']
          assert mm['delay'] == 10
          assert mm['timeout'] == 20
          assert mm['selection'] == 'weighted_random'
          assert len(mm['types']) == 8
          for item in mm['types'].values():
              assert item['multiplier'] == 1
              assert item['min_rating_diff'] == 0
              assert item['max_rating_diff'] == 10000
          print('Config valid')
          PY

      - name: Commit clean patch
        run: |
          rm -f .github/workflows/apply-matchmaking-config-fix.yml
          rm -f .github/workflows/apply-mm-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tune matchmaking config for active opponent search"
          git push origin HEAD:matchmaking-config-fix
